spring.application.name=PetHaven
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/pet_final?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:file:./.local/application-local.properties,optional:file:../.local/application-local.properties
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jackson.deserialization.fail-on-unknown-properties=true
mybatis.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
server.error.include-message=never
server.error.include-stacktrace=never

spring.jackson.deserialization.accept-float-as-int=false
spring.thymeleaf.check-template-location=false
