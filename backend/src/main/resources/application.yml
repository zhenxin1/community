server:
  address: ${APP_HOST:127.0.0.1}
  port: ${APP_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        name: JSESSIONID
        path: /api
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: pet-community
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33079/pet_community?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:pet_app}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET SESSION time_zone = '+00:00'
      maximum-pool-size: 8
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
app:
  storage-root: ${APP_STORAGE_ROOT:./storage/uploads}
